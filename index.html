<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

    <title>玉龙视觉效果工作室</title>
    <meta name="description" content="玉龙视觉效果工作室 — 用技术创造视觉之美。">

    <link rel="icon" href="./favicon.ico">

    <!-- ===== 主题（docsify v5）：核心主题 + 暗色插件 ===== -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link id="theme-css-dark" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">

    <!-- ===== 自定义样式 ===== -->
    <link rel="stylesheet" href="./css/custom.css">
</head>

<body class="sidebar-chevron-right">
    <div id="app"></div>

    <!-- ===== Docsify 配置（含自定义插件） ===== -->
    <script src="./js/docsify.config.js"></script>

    <!-- ===== MathJax 配置 ===== -->
    <script src="./js/mathjax.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- ===== Docsify 核心与官方插件 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

    <!-- ===== 第三方插件 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

    <!-- ===== Mermaid ===== -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

    <!-- ===== 主题切换按钮 ===== -->
    <button id="theme-toggle" title="切换主题">☀️</button>
    <script src="./js/theme-toggle.js"></script>
</body>

</html>
