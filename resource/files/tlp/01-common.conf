# 通用配置 - AC/BAT 均生效

# 禁用 NMI watchdog
NMI_WATCHDOG=0

# 开机启用 WiFi
DEVICES_TO_ENABLE_ON_STARTUP="wifi"

# 电池充电阈值
START_CHARGE_THRESH_BAT0=80
STOP_CHARGE_THRESH_BAT0=95

# USB 排除项：如果某个设备休眠后出问题，取消注释并填入设备 ID
# 用 `tlp-stat -u` 可以查看所有 USB 设备的 ID 和状态
# USB_EXCLUDE_DEVICE="046d:c52b"   # 例：罗技鼠标接收器
# USB_EXCLUDE_AUDIO=1
#
#
